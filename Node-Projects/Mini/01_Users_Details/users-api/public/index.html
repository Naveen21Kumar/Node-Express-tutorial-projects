<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
  <div class="container py-5">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <h1 class="m-0">Users</h1>
      <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addUserModal">
        <i class="bi bi-plus-lg"></i> Add User
      </button>
    </div>

    <div id="alert-container"></div>

    <div class="table-responsive">
      <table class="table table-striped table-bordered">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Contact</th>
            <th>Email</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Address</th>
            <th>Line 1</th>
            <th>Line 2</th>
            <th>Country</th>
            <th>State</th>
            <th>Apartment</th>
            <th>Action</th> <!-- New Action column for edit/delete -->
          </tr>
        </thead>
        <tbody id="users-table-body">
          <tr>
            <td colspan="12" class="text-center">Loading users...</td> <!-- Updated colspan -->
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Add User Modal -->
  <div class="modal fade" id="addUserModal" tabindex="-1" aria-labelledby="addUserModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="add-user-form">
          <div class="modal-header">
            <h5 class="modal-title" id="addUserModalLabel">Add New User</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="contact">Contact</label>
                <input type="text" id="contact" name="contact" class="form-control" value="123-456-7890" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" name="email" class="form-control" value="test@example.com" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="firstname">First Name</label>
                <input type="text" id="firstname" name="firstname" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="lastname">Last Name</label>
                <input type="text" id="lastname" name="lastname" class="form-control" required>
              </div>
              <div class="col-md-12">
                <label class="form-label" for="address">Address</label>
                <input type="text" id="address" name="address" class="form-control" value="Home">
              </div>
              <div class="col-md-6">
                <label class="form-label" for="line1">Line 1</label>
                <input type="text" id="line1" name="line1" class="form-control" value="123 Main St">
              </div>
              <div class="col-md-6">
                <label class="form-label" for="line2">Line 2</label>
                <input type="text" id="line2" name="line2" class="form-control" value="Apt 4B">
              </div>
              <div class="col-md-4">
                <label class="form-label" for="country">Country</label>
                <input type="text" id="country" name="country" class="form-control" value="USA">
              </div>
              <div class="col-md-4">
                <label class="form-label" for="state">State</label>
                <input type="text" id="state" name="state" class="form-control" value="NY">
              </div>
              <div class="col-md-4">
                <label class="form-label" for="apartment">Apartment</label>
                <input type="text" id="apartment" name="apartment" class="form-control" value="4B">
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save User</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Edit User Modal -->
  <div class="modal fade" id="editUserModal" tabindex="-1" aria-labelledby="editUserModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="edit-user-form">
          <div class="modal-header">
            <h5 class="modal-title" id="editUserModalLabel">Edit User</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="edit-user-id"> <!-- Hidden field for user ID -->
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="edit-contact">Contact</label>
                <input type="text" id="edit-contact" name="contact" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="edit-email">Email</label>
                <input type="email" id="edit-email" name="email" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="edit-firstname">First Name</label>
                <input type="text" id="edit-firstname" name="firstname" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="edit-lastname">Last Name</label>
                <input type="text" id="edit-lastname" name="lastname" class="form-control" required>
              </div>
              <div class="col-md-12">
                <label class="form-label" for="edit-address">Address</label>
                <input type="text" id="edit-address" name="address" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label" for="edit-line1">Line 1</label>
                <input type="text" id="edit-line1" name="line1" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label" for="edit-line2">Line 2</label>
                <input type="text" id="edit-line2" name="line2" class="form-control">
              </div>
              <div class="col-md-4">
                <label class="form-label" for="edit-country">Country</label>
                <input type="text" id="edit-country" name="country" class="form-control">
              </div>
              <div class="col-md-4">
                <label class="form-label" for="edit-state">State</label>
                <input type="text" id="edit-state" name="state" class="form-control">
              </div>
              <div class="col-md-4">
                <label class="form-label" for="edit-apartment">Apartment</label>
                <input type="text" id="edit-apartment" name="apartment" class="form-control">
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Update User</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    // Utility function to display alerts
    function showAlert(message, type = 'danger') {
      $('#alert-container').html(
        `<div class="alert alert-${type} alert-dismissible fade show" role="alert">
          ${message}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>`
      );
    }

    // Function to render users in the table
    function renderUsers(users) {
      if (!users.length) {
        $('#users-table-body').html(
          '<tr><td colspan="12" class="text-center">No users found.</td></tr>' // Updated colspan
        );
        return;
      }

      const rows = users.map(user => `
        <tr>
          <td>${user.id}</td>
          <td>${user.contact || ''}</td>
          <td>${user.email || ''}</td>
          <td>${user.firstname || ''}</td>
          <td>${user.lastname || ''}</td>
          <td>${user.address || ''}</td>
          <td>${user.line1 || ''}</td>
          <td>${user.line2 || ''}</td>
          <td>${user.country || ''}</td>
          <td>${user.state || ''}</td>
          <td>${user.apartment || ''}</td>
          <td>
            <button class="btn btn-sm btn-outline-primary edit-btn" data-user-id="${user.id}">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger delete-btn" data-user-id="${user.id}">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      `).join('');

      $('#users-table-body').html(rows);
    }

    // Function to load users from API
    function loadUsers() {
      $.ajax({
        url: '/users',
        method: 'GET',
        dataType: 'json'
      })
        .done(renderUsers)
        .fail(function (xhr) {
          const message = xhr.responseJSON?.error || 'Failed to load users.';
          showAlert(message, 'warning');
          $('#users-table-body').html(
            '<tr><td colspan="12" class="text-center text-danger">Unable to load data.</td></tr>' // Updated colspan
          );
        });
    }

    // Function to reset the add form
    function resetForm() {
      $('#add-user-form')[0].reset();
    }

    // Function to reset the edit form
    function resetEditForm() {
      $('#edit-user-form')[0].reset();
    }

    // Function to populate edit modal with user data
    function populateEditModal(user) {
      $('#edit-user-id').val(user.id);
      $('#edit-contact').val(user.contact || '');
      $('#edit-email').val(user.email || '');
      $('#edit-firstname').val(user.firstname || '');
      $('#edit-lastname').val(user.lastname || '');
      $('#edit-address').val(user.address || '');
      $('#edit-line1').val(user.line1 || '');
      $('#edit-line2').val(user.line2 || '');
      $('#edit-country').val(user.country || '');
      $('#edit-state').val(user.state || '');
      $('#edit-apartment').val(user.apartment || '');
    }

    // Function to handle delete action
    function deleteUser(userId) {
      if (confirm('Are you sure you want to delete this user?')) {
        $.ajax({
          url: `/users/${userId}`,
          method: 'DELETE'
        })
          .done(function () {
            showAlert('User deleted successfully.', 'success');
            loadUsers(); // Reload users after delete
          })
          .fail(function (xhr) {
            const message = xhr.responseJSON?.error || 'Failed to delete user.';
            showAlert(message, 'danger');
          });
      }
    }

    $(function () {
      // Load users on page load
      loadUsers();

      // Initialize modals
      const addUserModalEl = document.getElementById('addUserModal');
      const addUserModal = new bootstrap.Modal(addUserModalEl);
      const editUserModalEl = document.getElementById('editUserModal');
      const editUserModal = new bootstrap.Modal(editUserModalEl);

      // Handle add user form submission
      $('#add-user-form').on('submit', function (event) {
        event.preventDefault();
        const payload = {
          contact: $('#contact').val().trim(),
          email: $('#email').val().trim(),
          firstname: $('#firstname').val().trim(),
          lastname: $('#lastname').val().trim(),
          address: $('#address').val().trim(),
          line1: $('#line1').val().trim(),
          line2: $('#line2').val().trim(),
          country: $('#country').val().trim(),
          state: $('#state').val().trim(),
          apartment: $('#apartment').val().trim()
        };
        $.ajax({
          url: '/users',
          method: 'POST',
          contentType: 'application/json',
          data: JSON.stringify(payload),
          dataType: 'json'
        })
          .done(function () {
            addUserModal.hide();
            showAlert('User added successfully.', 'success');
            loadUsers();
            resetForm();
          })
          .fail(function (xhr) {
            const message = xhr.responseJSON?.error || 'Failed to add user.';
            showAlert(message, 'danger');
          });
      });

      // Handle edit user form submission
      $('#edit-user-form').on('submit', function (event) {
        event.preventDefault();
        const userId = $('#edit-user-id').val();
        const payload = {
          contact: $('#edit-contact').val().trim(),
          email: $('#edit-email').val().trim(),
          firstname: $('#edit-firstname').val().trim(),
          lastname: $('#edit-lastname').val().trim(),
          address: $('#edit-address').val().trim(),
          line1: $('#edit-line1').val().trim(),
          line2: $('#edit-line2').val().trim(),
          country: $('#edit-country').val().trim(),
          state: $('#edit-state').val().trim(),
          apartment: $('#edit-apartment').val().trim()
        };
        $.ajax({
          url: `/users/${userId}`,
          method: 'PUT',
          contentType: 'application/json',
          data: JSON.stringify(payload),
          dataType: 'json'
        })
          .done(function () {
            editUserModal.hide();
            showAlert('User updated successfully.', 'success');
            loadUsers();
            resetEditForm();
          })
          .fail(function (xhr) {
            const message = xhr.responseJSON?.error || 'Failed to update user.';
            showAlert(message, 'danger');
          });
      });

      // Handle edit button clicks
      $(document).on('click', '.edit-btn', function () {
        const userId = $(this).data('user-id');
        // Fetch user data for editing
        $.ajax({
          url: `/users/${userId}`,
          method: 'GET',
          dataType: 'json'
        })
          .done(function (user) {
            populateEditModal(user);
            editUserModal.show();
          })
          .fail(function (xhr) {
            const message = xhr.responseJSON?.error || 'Failed to load user for editing.';
            showAlert(message, 'danger');
          });
      });

      // Handle delete button clicks
      $(document).on('click', '.delete-btn', function () {
        const userId = $(this).data('user-id');
        deleteUser(userId);
      });

      // Reset forms when modals are hidden
      addUserModalEl.addEventListener('hidden.bs.modal', resetForm);
      editUserModalEl.addEventListener('hidden.bs.modal', resetEditForm);
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
